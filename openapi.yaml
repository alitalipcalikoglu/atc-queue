openapi: 3.1.0
info:
  title: atc-queue
  version: "1.0.0"
  description: >
    Durable SQLite message queue for service-to-service work. At-least-once delivery: a pulled
    message is leased (invisible) until acked (deleted), nacked (visible again after a backoff) or
    its lease expires; after `maxAttempts` deliveries it becomes a dead letter until redriven,
    deleted, purged or expired (`DEAD_RETENTION_DAYS`).


    Auth: `Authorization: Bearer <api-key>` on every `/v1/*` and `/metrics` route. Roles: `read`
    (browse, stats), `write` (enqueue, pull, ack, nack, extend), `readwrite` (both), `admin`
    (everything, including queue settings, purge, redrive and deletes). A key may be scoped to
    queues (`id:secret:role:queue+queue`); it gets `403` elsewhere and sees only its queues in
    lists and stats.
servers:
  - url: /
security:
  - ApiKeyAuth: []
tags:
  - name: queues
  - name: messages
  - name: stats
  - name: ops
paths:
  /openapi.yaml:
    get:
      operationId: atc-queue.openapi
      summary: Download the canonical OpenAPI document
      security: []
      responses:
        "200": { description: Canonical OpenAPI document., content: { text/yaml: { schema: { type: string } } } }
  /health:
    get:
      operationId: atc-queue.health.get
      summary: Liveness probe
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: Process is up., content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } } }
  /ready:
    get:
      operationId: atc-queue.ready.get
      summary: Readiness probe
      description: Database ping, cached for 10 seconds.
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: Ready., content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } } }
        "503": { description: The cached readiness check last failed., content: { application/json: { schema: { type: object, required: [status, error], properties: { status: { type: string, enum: [unavailable] }, error: { type: string } } } } } }
  /v1/info:
    get:
      operationId: atc-queue.info.get
      summary: Service identity and capabilities
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Instance identity.
          content:
            application/json:
              schema:
                type: object
                required: [service, version, apiVersion, capabilities, schemaVersion, serviceCore]
                properties:
                  service: { type: string, const: atc-queue }
                  version: { type: string }
                  apiVersion: { type: string, const: v1 }
                  capabilities: { type: array, items: { type: string }, description: "`leases`, `delays`, `priorities`, `dedupe`, `dead-letters`, `long-poll`, `queue-scoped-keys`." }
                  schemaVersion: { type: integer }
                  serviceCore: { type: string }
  /metrics:
    get:
      operationId: atc-queue.metrics.get
      summary: Prometheus text-format metrics
      description: Requires a `read`-capable key. Not rate-limited.
      tags: [ops]
      x-stack-visibility: operational
      responses:
        "200": { description: "`queue_messages{queue,state}`, `queue_oldest_ready_seconds{queue}`, `queue_events_total{queue,event}` (persisted lifetime counters: enqueued, delivered, acked, nacked, expired, dead, redriven), `queue_process_uptime_seconds`.", content: { text/plain: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/queues:
    get:
      operationId: atc-queue.queues.list
      summary: Queues with their depth
      tags: [queues]
      responses:
        "200":
          description: Queues visible to the key, by name.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { $ref: "#/components/schemas/QueueSummary" } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/queues/{name}:
    parameters: [{ $ref: "#/components/parameters/NameParam" }]
    put:
      operationId: atc-queue.queues.upsert
      summary: Create a queue or change its settings (admin)
      description: Omitted fields keep their current value (defaults on create - visibility 30 s, 5 attempts, backoff 5 s doubling to 900 s).
      tags: [queues]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/QueueSettings" }
      responses:
        "200": { $ref: "#/components/responses/QueueSet" }
        "201": { $ref: "#/components/responses/QueueSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: atc-queue.queues.get
      summary: One queue with depth by state, oldest due age and lifetime counters
      tags: [queues]
      responses:
        "200":
          description: The queue.
          content:
            application/json:
              schema:
                type: object
                required: [queue, depth, oldestReadySec, counters]
                properties:
                  queue: { $ref: "#/components/schemas/Queue" }
                  depth: { $ref: "#/components/schemas/Depth" }
                  oldestReadySec: { type: [integer, "null"] }
                  counters: { type: object, additionalProperties: { type: integer } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: atc-queue.queues.delete
      summary: Delete a queue (admin)
      description: Refused with `409 QUEUE_NOT_EMPTY` while it holds messages, unless `force=true` (all messages are deleted with it).
      tags: [queues]
      parameters:
        - { name: force, in: query, schema: { type: string, enum: ["true", "false"] } }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/queues/{name}/purge:
    parameters: [{ $ref: "#/components/parameters/NameParam" }]
    post:
      operationId: atc-queue.queues.purge
      summary: Delete ready, dead or all messages (admin)
      description: "`ready` includes delayed messages; `all` also removes leased ones (their acks then answer `MESSAGE_NOT_FOUND`)."
      tags: [queues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [state], properties: { state: { type: string, enum: [ready, dead, all] } } }
      responses:
        "200": { description: Removed count., content: { application/json: { schema: { type: object, required: [removed], properties: { removed: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/queues/{name}/redrive:
    parameters: [{ $ref: "#/components/parameters/NameParam" }]
    post:
      operationId: atc-queue.queues.redrive
      summary: Move dead letters back to ready (admin)
      description: Attempts are reset. Pass `ids` for some, or `all` for every dead letter of the queue.
      tags: [queues]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { ids: { type: array, minItems: 1, maxItems: 1000, items: { $ref: "#/components/schemas/MessageId" } }, all: { const: true } } }
      responses:
        "200": { description: Redriven count., content: { application/json: { schema: { type: object, required: [redriven], properties: { redriven: { type: integer } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/queues/{name}/messages:
    parameters: [{ $ref: "#/components/parameters/NameParam" }]
    post:
      operationId: atc-queue.messages.enqueue
      summary: Enqueue one message (write)
      description: "`201` for a new message; `200` with `deduplicated: true` when a message with the same `dedupeKey` is still in the queue (that message is returned unchanged)."
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NewMessage" }
      responses:
        "200": { $ref: "#/components/responses/Enqueued" }
        "201": { $ref: "#/components/responses/Enqueued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }
    get:
      operationId: atc-queue.messages.list
      summary: Browse messages by state, oldest first (read)
      tags: [messages]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [ready, delayed, leased, dead] } }
        - { name: limit, in: query, schema: { type: string, pattern: "^([1-9]|[1-9][0-9]|1[0-9][0-9]|200)$" }, description: Default 50, max 200. }
        - { name: cursor, in: query, schema: { type: string, pattern: "^[0-9]{1,15}$" } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Message" } }, nextCursor: { type: [string, "null"] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/queues/{name}/messages/batch:
    parameters: [{ $ref: "#/components/parameters/NameParam" }]
    post:
      operationId: atc-queue.messages.enqueueBatch
      summary: Enqueue up to MAX_BATCH messages in one transaction (write)
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [messages], properties: { messages: { type: array, minItems: 1, maxItems: 1000, items: { $ref: "#/components/schemas/NewMessage" } } } }
      responses:
        "201":
          description: Every message, in order, each with its dedupe flag.
          content:
            application/json:
              schema: { type: object, required: [items], properties: { items: { type: array, items: { type: object, properties: { message: { $ref: "#/components/schemas/Message" }, deduplicated: { type: boolean } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "413": { $ref: "#/components/responses/TooLarge" }

  /v1/queues/{name}/pull:
    parameters: [{ $ref: "#/components/parameters/NameParam" }]
    post:
      operationId: atc-queue.messages.pull
      summary: Lease up to `max` due messages, optionally waiting `waitSec` (write)
      description: Highest priority first, then oldest due. Each returned message carries a `leaseToken` valid until `leaseUntil`; ack, nack or extend it with that token. A paused queue returns nothing.
      tags: [messages]
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false, properties: { max: { type: integer, minimum: 1, maximum: 1000 }, visibilitySec: { type: integer, minimum: 1, maximum: 43200 }, waitSec: { type: integer, minimum: 0, maximum: 25 } } }
      responses:
        "200":
          description: Leased messages (possibly none).
          content:
            application/json:
              schema: { type: object, required: [messages], properties: { messages: { type: array, items: { $ref: "#/components/schemas/LeasedMessage" } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/queues/{name}/messages/{id}:
    parameters: [{ $ref: "#/components/parameters/NameParam" }, { $ref: "#/components/parameters/IdParam" }]
    get:
      operationId: atc-queue.messages.get
      summary: One message (read)
      tags: [messages]
      responses:
        "200": { description: The message., content: { application/json: { schema: { type: object, required: [message], properties: { message: { $ref: "#/components/schemas/Message" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: atc-queue.messages.delete
      summary: Delete one message that is not leased (admin)
      tags: [messages]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/queues/{name}/messages/{id}/ack:
    parameters: [{ $ref: "#/components/parameters/NameParam" }, { $ref: "#/components/parameters/IdParam" }]
    post:
      operationId: atc-queue.messages.ack
      summary: Acknowledge (delete) a leased message (write)
      tags: [messages]
      requestBody: { $ref: "#/components/requestBodies/Lease" }
      responses:
        "204": { description: Acknowledged. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/queues/{name}/messages/{id}/nack:
    parameters: [{ $ref: "#/components/parameters/NameParam" }, { $ref: "#/components/parameters/IdParam" }]
    post:
      operationId: atc-queue.messages.nack
      summary: Give a leased message back (write)
      description: Visible again after `delaySec`, or the queue's backoff (`backoffBaseSec * 2^(attempts-1)`, capped at `backoffMaxSec`); a dead letter when attempts are used up or `dead` is true.
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [leaseToken], properties: { leaseToken: { $ref: "#/components/schemas/LeaseToken" }, delaySec: { type: integer, minimum: 0, maximum: 1209600 }, error: { type: string, maxLength: 1000 }, dead: { type: boolean } } }
      responses:
        "200":
          description: What happened, and the message afterwards.
          content:
            application/json:
              schema: { type: object, required: [outcome, message], properties: { outcome: { type: string, enum: [retry, dead] }, message: { $ref: "#/components/schemas/Message" } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/queues/{name}/messages/{id}/extend:
    parameters: [{ $ref: "#/components/parameters/NameParam" }, { $ref: "#/components/parameters/IdParam" }]
    post:
      operationId: atc-queue.messages.extend
      summary: Extend a lease to now + visibilitySec (write)
      tags: [messages]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false, required: [leaseToken, visibilitySec], properties: { leaseToken: { $ref: "#/components/schemas/LeaseToken" }, visibilitySec: { type: integer, minimum: 1, maximum: 43200 } } }
      responses:
        "200": { description: New lease end., content: { application/json: { schema: { type: object, required: [leaseUntil], properties: { leaseUntil: { type: string, format: date-time } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/stats:
    get:
      operationId: atc-queue.stats.get
      summary: Totals and per-queue depth (read)
      tags: [stats]
      responses:
        "200":
          description: Over the queues visible to the key.
          content:
            application/json:
              schema:
                type: object
                required: [queues, ready, delayed, leased, dead, oldestReadySec, items]
                properties:
                  queues: { type: integer }
                  ready: { type: integer }
                  delayed: { type: integer }
                  leased: { type: integer }
                  dead: { type: integer }
                  oldestReadySec: { type: [integer, "null"] }
                  items: { type: array, items: { type: object, properties: { queue: { type: string }, ready: { type: integer }, delayed: { type: integer }, leased: { type: integer }, dead: { type: integer }, counters: { type: object, additionalProperties: { type: integer } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "`QUEUE_API_KEYS=id:secret[:role[:queue+queue]]`; role `read`, `write`, `readwrite` (default) or `admin`."
  parameters:
    NameParam: { name: name, in: path, required: true, schema: { type: string, pattern: "^[a-z][a-z0-9._-]{0,63}$" } }
    IdParam: { name: id, in: path, required: true, schema: { $ref: "#/components/schemas/MessageId" } }
  requestBodies:
    Lease:
      required: true
      content:
        application/json:
          schema: { type: object, additionalProperties: false, required: [leaseToken], properties: { leaseToken: { $ref: "#/components/schemas/LeaseToken" } } }
  responses:
    BadRequest: { description: "`VALIDATION_FAILED` or `INVALID_ARGUMENT`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Missing or invalid API key., headers: { www-authenticate: { schema: { type: string, const: Bearer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: "`FORBIDDEN`: role or queue scope.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: "`QUEUE_NOT_FOUND` or `MESSAGE_NOT_FOUND`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: "`LEASE_LOST`, `QUEUE_FULL`, `QUEUE_NOT_EMPTY`, `INVALID_STATE`, `LIMIT_EXCEEDED`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    TooLarge: { description: "`MESSAGE_TOO_LARGE`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    QueueSet: { description: Created (201) or updated (200)., content: { application/json: { schema: { type: object, required: [created, queue], properties: { created: { type: boolean }, queue: { $ref: "#/components/schemas/Queue" } } } } } }
    Enqueued: { description: The message., content: { application/json: { schema: { type: object, required: [message, deduplicated], properties: { message: { $ref: "#/components/schemas/Message" }, deduplicated: { type: boolean } } } } } }
  schemas:
    ErrorEnvelope: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, details: {} } } } }
    MessageId: { type: string, pattern: "^msg_[0-9a-z]{6,12}[0-9a-f]{16}$" }
    LeaseToken: { type: string, pattern: "^[0-9a-f-]{36}$" }
    QueueSettings:
      type: object
      additionalProperties: false
      properties:
        description: { type: string, maxLength: 500 }
        visibilitySec: { type: integer, minimum: 1, maximum: 43200, description: Default lease of a pull. }
        maxAttempts: { type: integer, minimum: 1, maximum: 100, description: Deliveries before dead-lettering. }
        backoffBaseSec: { type: integer, minimum: 0, maximum: 86400 }
        backoffMaxSec: { type: integer, minimum: 0, maximum: 604800 }
        paused: { type: boolean, description: Pulls return nothing while paused; enqueue still works. }
    Queue:
      type: object
      properties:
        name: { type: string }
        description: { type: string }
        visibilitySec: { type: integer }
        maxAttempts: { type: integer }
        backoffBaseSec: { type: integer }
        backoffMaxSec: { type: integer }
        paused: { type: boolean }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Depth: { type: object, properties: { ready: { type: integer }, delayed: { type: integer }, leased: { type: integer }, dead: { type: integer } } }
    QueueSummary:
      allOf:
        - $ref: "#/components/schemas/Queue"
        - type: object
          properties:
            ready: { type: integer }
            delayed: { type: integer }
            leased: { type: integer }
            dead: { type: integer }
            oldestReadySec: { type: [integer, "null"] }
    NewMessage:
      type: object
      additionalProperties: false
      required: [body]
      properties:
        body: { description: Any JSON, up to MAX_MESSAGE_BYTES encoded. }
        delaySec: { type: integer, minimum: 0, maximum: 1209600 }
        priority: { type: integer, minimum: -100, maximum: 100, description: Higher first; default 0. }
        dedupeKey: { type: string, minLength: 1, maxLength: 200, description: "While a message with this key is in the queue, enqueuing it again returns that message." }
    Message:
      type: object
      properties:
        id: { $ref: "#/components/schemas/MessageId" }
        queue: { type: string }
        body: {}
        priority: { type: integer }
        dedupeKey: { type: [string, "null"] }
        state: { type: string, enum: [ready, delayed, leased, dead] }
        attempts: { type: integer }
        availableAt: { type: string, format: date-time }
        leaseUntil: { type: [string, "null"], format: date-time }
        lastError: { type: [string, "null"] }
        enqueuedBy: { type: string }
        enqueuedAt: { type: string, format: date-time }
        deadAt: { type: [string, "null"], format: date-time }
    LeasedMessage:
      allOf:
        - $ref: "#/components/schemas/Message"
        - type: object
          required: [leaseToken]
          properties:
            leaseToken: { $ref: "#/components/schemas/LeaseToken" }
